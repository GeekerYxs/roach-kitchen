# 料理工位化生产 配置（设计见 ..\docs\FACTORY_DESIGN.md）
# 不需要账号密码：直接接管已经用 一键进游戏.cmd 进入游戏的窗口。

[factory]
db = 'state/factory.db'   # 所有工序共用的数据库（相对 batch_provision 目录）
tick = 0.2                # 每隔多少秒读一次状态
meat_timeout = 60         # 吃小肉林：每个角色最多用多少秒
shoe_timeout = 60         # 记录飞鞋：每个角色最多用多少秒
gold_amount = 500         # 发金币：每次给多少（传送费 190，500 够两次）
gold_topup_below = 380    # 发金币：小号金币低于这个数才补（380 = 两次传送费）
gold_timeout = 60         # 发金币：每个小号最多用多少秒（含重试）
trade_step_gap = 0.5      # 交易每一步请求之间隔多少秒
well_team_size = 4        # 古井组队：每批最多带几个小号（1..4）
well_form_timeout = 120   # 古井组队：队长走到出生点 + 邀请 + 吃地瓜，整批最多用多少秒
well_lease = 1200         # 古井组队：认领小号的租约秒数（工序 4b 接手后续期）
well_train_timeout = 1800 # 古井带练：去古井 + 练到全员 11 级 + 回城，整批最多用多少秒
leader_skill = 803        # 古井带练：队长人物技能（扫射）
pet_magic = 1504          # 古井带练：队长宠物法术（烈焰爆发）
pet_mp_min = 100          # 古井带练：宠物魔力低于这个数就改用普通攻击
member_attack = false     # 古井带练：小号和小号的宠物在战斗中也普通攻击。实测 2026-10-12 会更慢（每场约 25 秒，不打约 14 秒：动作逐个播放）
transport_team_size = 4   # 调度员传送：每批最多带几个小号（1..4）
transport_timeout = 240   # 调度员传送：补金币 + 组队 + 走到 PP 鸡 + 传送 + 离队 + 回城，整批最多用多少秒
transport_lease = 600     # 调度员传送：认领小号的租约秒数
quest_timeout = 120       # 接任务 78：每个小号走到海子 + 对话 + 核验，最多用多少秒
coast_team_size = 4       # 海岸刷怪：每个队长每批最多带几个小号（1..4）
coast_form_timeout = 120  # 海岸刷怪：小号走到集合点 + 邀请入队，最多用多少秒
coast_farm_timeout = 1800 # 海岸刷怪：队长回到海岸 + 组队 + 刷腿 + 刷鸡屁股 + 回集合点解散，整批最多用多少秒
coast_lease = 1200        # 海岸刷怪：认领小号的租约秒数（刷怪中每 10 秒续期）
coast_legs_patrol = [[678, 1821], [400, 1880]]     # 刷「小强的大腿」10571：A 点和来回巡逻的第二个点（旧程序 runtime/pipeline.py）
coast_rumps_patrol = [[1170, 2883], [1000, 2700]]  # 刷「鸡屁股」10572：B 点和来回巡逻的第二个点
receiver_post = [1780, 1370]   # 收货人常驻点 = 小号交任务站的位置（海子旁边，81 号地图）；收货人的飞鞋也记在这里
receive_post_timeout = 180     # 收货人回到常驻点（飞鞋 / 回城卷 + PP 鸡 + 走路）+ 记录飞鞋，最多用多少秒
receive_timeout = 60           # 收货：每个小号（含走近、交易、核验、重试）最多用多少秒
receive_lease = 120            # 收货：认领小号的租约秒数

# 队长补给（factory/supply.py）：每批开工前看一眼背包，低于下限就补到上限；背包空位不够就先卖杂物。
#   海岸：军医花袭人（PP鸡 落地点 1152,932）卖 萝卜糕 / 胡萝卜汁 / 回城卷，也收杂物
#   村里：宠物商人小美（出生点 1338,1155）卖 甜点
#   古井队长、调度员在村里：甜点就地买；回城卷 / 红蓝药 / 卖杂物 坐 PP鸡 去海岸花袭人，再用回城卷回村
#   海岸队长在海岸：就地找花袭人；甜点用回城卷回村找小美，再坐 PP鸡 回来
# 物品：scroll 回城卷(100 金币，每格 50)  hp 萝卜糕(5)  mp 胡萝卜汁(5)  pet 甜点(240，宠物忠诚度)
# 每种写 [下限, 上限]；某个工位不需要补给就写空表，例如 [supply.dispatcher] 下面什么都不写。
[supply]
enabled = true
keep_free = 3              # 买东西时背包至少留这么多空格
sell_below_free = 8        # 背包空格少于这个数，就在花袭人卖杂物（游戏自带"自动卖店"那几类：灰杂物、白/绿装备武器、白技能石、白绿配方；重要物品和补给品永远不卖）
sell_blue = false          # 蓝色技能石 / 蓝色配方也卖（默认不卖，以防有价值）
retry_after_minutes = 10   # 补给失败（走不到、没到账）后这么多分钟再试；这一批照常开工
timeout = 300              # 一次补给（含跑去海岸/回村）最多用多少秒

[supply.well]              # 古井队长
scroll = [20, 100]
hp = [30, 198]
mp = [30, 198]
pet = [10, 99]

[supply.coast]             # 海岸队长
scroll = [20, 100]
hp = [30, 198]
mp = [30, 198]
pet = [10, 99]

[supply.dispatcher]        # 调度员：每次传送完用一张回城卷回村
scroll = [20, 100]

# 财政主管（factory/treasury.py）：收货人兼任。小号删号前把金币交给收货人；调度员、古井队长、海岸队长的金币低于下限，
# 就去收货人那里领到目标数（海岸队长每批结束就在收货人旁边；调度员、古井队长坐 PP鸡 去海岸，和买补给同一趟）。
# 每个写 [下限, 目标]。换收货人时，它身上的金币要一起交给新收货人。
[treasury]
enabled = true
reserve = 500000           # 收货人至少留这么多，不往外拨
max_per_trade = 1000000    # 一笔交易最多给这么多（2026-10-20 实测单笔 10 万、100 万都分毫不差、无手续费；更大的没测）
dispatcher = [200000, 1000000]   # 调度员：每个小号发 500，每小时约花 4 万；1000000 约够一天
well = [20000, 100000]           # 古井队长：每批一张回城卷 + 甜点
coast = [20000, 100000]          # 海岸队长：卖杂物基本够自己用
