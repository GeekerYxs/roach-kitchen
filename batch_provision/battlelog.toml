# 战斗记录（实时，一键战斗记录.cmd）：只读游戏内存 + 定时导入监听文件，不注入、不发包。
# 角色按窗口标题里的名字找（标题里 "-cap01_" 这样的部分）。窗口关了/重开会自己重新找。
# 有 DLL 的窗口（登录器开的，或 research/shitu/attach_tap.py 挂过的）还会有整包记录；没有 DLL 的只有内存这一半。

roles = ["cap01", "cap02"]

poll_seconds = 0.3          # 多久读一次内存（答题弹窗的计时精度）
import_minutes = 10         # 每隔多少分钟导入一次监听文件并合并
