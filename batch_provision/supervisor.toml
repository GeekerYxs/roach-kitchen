# 工序 11 总大脑（supervisor）：所有工位同时开工，按队列缺人自动登录/关闭小号窗口。
# 整条线 —— 新角色（新手出村 → 吃小肉林 → 记录飞鞋）→ 古井组队带练 → 调度员补金币+传送 → 接任务 78 → 海岸刷怪
#   → 交任务 → 收货人收料理 → 关窗 → 删除（11d）→ 约 3 小时后槽位释放，在原槽建新角色（11e，mw01r1 → mw01r5 → mw01r9）。
# 前提：工位号第一次要用 一键登录工位.cmd 登录登记一次（调度员、古井队长、海岸队长、收货人）。之后掉线（回到登录界面、进程没了）
#   总大脑会自己关窗重登（station_relogin）；重登不了的工位只有它自己暂停。开着总大脑时不要手动把工位号退到选角界面。
# 中途停：在黑窗口按 Ctrl+C。窗口保留；再次双击会接管它们接着做。
# 日志 logs\supervisor_*.log，每分钟一行汇总（窗口数、各段人数、本次收到的料理数、工位状态）。
# 账号密码和游戏路径在 local.toml（不上传）。路径请用单引号（TOML 单引号字符串里的反斜杠不转义）。

[game]
# exe（游戏路径）每台电脑不同，写在 local.toml
server_index = 0

[batch]
slots = [1, 2, 3, 4]         # 哪些角色槽参与（按名字 mwXXrN 找角色，不按槽序号）
max_windows = 4              # (登录工具内部用；小号窗口上限见下面 [supervisor])
launch_interval = 2.0        # 相邻两次拉起游戏的间隔秒数
inject_delay_ms = 3000
login_retries = 2            # 登录失败时（只关本工具刚启动的那个进程）重开的次数
enter_timeout = 60
min_free_memory_mb = 3000    # 空闲内存低于这个值就暂停开新窗口
minimize = false             # true = 总大脑开的小号窗口自动最小化（省 CPU 和内存；实测不影响任何工序）。每个窗口只最小化一次，你点开看的不会再被最小化；工位窗口从不最小化。只想本机开：在 local.toml 写 [batch] minimize = true
arrange = true               # 总大脑启动时、工位自动重登后，把工位窗口排在主屏幕上（不改窗口大小，放不下就均匀叠一部分；之后可手动拖）

[novice]
escape_action = 8            # 万一角色还在菜鸟训练营，先走新手出村（逃跑指令编号，实测确认）
timeout = 300

[accounts]
# 号段和密码写在 local.toml（本机号段，所有小号工具共用）。
# 只想让本工具用别的号段时，才在这里写 prefix/start/count/digits（密码仍取 local.toml）。

[supervisor]
factory = 'factory.toml'     # 工序参数文件（和单独的一键工序共用）
max_windows = 20             # 小号窗口总数上限（不含工位号；内存不足时也会暂停开新窗口）
coast_buffer = 2             # 每个海岸队长：海岸等着组队（含正在传送、接任务）的小号少于这个数 × 海岸队长数，就先拉一个已到 11 级的角色上线
well_buffer = 4              # 每个古井队长：古井等着组队（含新手出村、吃肉、记飞鞋）的小号少于这个数 × 队长数，就拉一个新角色
coast_backlog = 4            # 每个海岸队长：海岸等着的已有这么多 × 海岸队长数，就暂停往古井送人（免得窗口都堵在海岸）
                             # （2 个海岸队长 = 等 4 个补人、8 个刹车，和以前一样；3 个 = 6 / 12）
coast_max_wait = 90          # 海岸队长凑不满 4 人时，最早排队的人等了这么多秒就带现有的人出发
well_max_wait = 90           # 古井队长凑不满 4 人时，最早排队的人等了这么多秒就带现有的人出发
transport_max_wait = 30      # 调度员凑不满 4 人时，最早排队的人等了这么多秒就带现有的人传送（传送很快）
fresh = true                 # 拉新角色去古井（false = 只跑海岸一半，和 11b 一样）
parallel_logins = 4          # 同时登录几个窗口
idle_close = 60              # 处在还没有工人负责的阶段的窗口，这么多秒后关掉
delete = true                # 交完料理的小号自动删除（删前核对任务完成、背包没料理、收货人收到过；同账号有窗口开着时不删）
delete_reply_timeout = 15    # 发出删除请求后等服务器回复的秒数；没回复 = 结果不明，不重发，请人工看选角界面
delete_close_settle = 3      # 小号窗口关掉后至少等这么多秒，才重新登录这个账号去删除
delete_close_timeout = 3     # （删除工序自己关窗时）先请窗口正常关闭，这么多秒没关掉就强制结束
rebuild = true               # 删除的槽位释放后自动建新角色（名字 = 原编号 + 4），新角色走新手出村后排进古井
rebuild_after_hours = 3.2    # 删除后过这么多小时才去看槽位（用户实测约 3 小时释放）
rebuild_retry_minutes = 20   # 槽位还没释放或出错时，这个账号隔这么多分钟再看
station_relogin = true       # 工位掉线自动重登：工位窗口读不到角色（掉回登录界面）就关窗，进程没了就按 stations 里的账号重新登录、进游戏、核对角色后接着干
stations = 'stations.toml'   # 自动重登用的工位配置（密码在 local.toml 的 [passwords]；local.toml 里写了 [[station]] 就用那里的）
station_lost_seconds = 30    # 工位窗口连续这么多秒读不到自己的角色，就判定掉线、关窗重登（换地图加载只要几秒）
quarantine_retry_hours = 2   # 被隔离的角色过这么多小时自动解除一次，回到流程里；第二次被隔离就一直放着（不删，只占一个槽）。0 = 不自动解除

# 料理仓库号（阶段 2c，factory/storeuse.py）：收货人背包空格 <= factory.toml receiver_bag_warn 时，总大脑让收货人停收，
# 登录名单里下一个没满的仓库角色（已经站在收货点，一键仓库号就位.cmd 送过去的），一格（99 个）一笔交易把料理交过去，
# 每笔核对双方数量；仓库号满了或料理交完就下线，factory.db 的 stores 表记下存量和空格（满了标 full），收货人接着收货。
# 用哪些仓库账号写在 local.toml（每次启动由你指定），例如：
#   [receiver]
#   stores = ["box07", "box08"]
# 密码取 local.toml 的 [store_accounts]。名单里某个账号一个就绪（ready）角色都没有，总大脑不启动。空表 = 不用仓库号。
# 一键仓库号收料理.cmd 用同一套设置单独跑一次（先停总大脑）。
[receiver]
stores = []
unload_max_stacks = 0        # 一次卸货最多交几格；0 = 不限（第一次实测在 local.toml 写 1）
unload_tries = 3             # 同一格交易这么多次料理都没过去，就停下这次卸货
unload_confirm_wait = 5      # 交易后这么多秒内双方数量要对上
unload_timeout = 900         # 每个仓库号：登录 + 走近 + 全部交易，最多用多少秒
unload_settle = 2            # 下线前站稳这么多秒
unload_relogin_gap = 10      # 一个仓库号下线后，隔这么多秒再登录下一个（下一个常是同一账号）
unload_retry_minutes = 10    # 总大脑：卸货没做完（出错、仓库号用完）后，隔这么多分钟再试
