# 师徒产线 v5 总控（python -X utf8 -m line）的设置。说明见 line/__main__.py 文件头和 docs/SHITU_LINE.md 第 8 节。
teams = ["a", "b", "fei", "tian"]   # 这次跑哪几队（队名 = 下面 [team.<名>]）
batches = [3]                 # 要跑的批次 = 账号 cap21..cap36 的角色槽；1、2 已在 2026-10-28 跑完（logs/line_state.json）
retries = 3                   # 一步失败后：清场（回城 / 离队）+ 5 秒，再跑，最多几次
recover_tries = 2             # 还不行：全员回城 + 等 recover_wait 秒，再跑，最多几次
recover_wait = 300
silent = 900                  # 日志这么多秒没变化 = 卡死，杀掉这一步的进程（算一次失败）
stagger = 60                  # 各队启动间隔（错开建号登录）

# 每队：master = 师傅角色名（人工登录，脚本没有师傅账号）；slot = 第几组账号和徒弟名（0..3，见 line/plan.py：
# 账号 cap(21+4*slot)..+3，第 N 批徒弟名 亿万(16(N-1)+4*slot+1..+4)）；gold = 师傅给每个徒弟的启动金。
# 队名同时是 logs/line_state.json 的键和 LOGID（r4<队名>_b<批>），换师傅就换队名，别的师傅的历史和排除名单不会串过来。
[team.a]
master = "伏地魔1"
slot = 0
gold = 50000

[team.b]
master = "伏地魔2"
slot = 1
gold = 50000

[team.c]                      # 第 4 轮第 1、2 批；2026-10-28 第 3 批起这组账号换给 飞天
master = "伏地魔3"
slot = 2
gold = 50000

[team.d]                      # 第 4 轮第 1、2 批；第 3 批起这组账号换给 舔尊
master = "伏地魔4"
slot = 3
gold = 10000

[team.fei]                    # 2026-10-28 第 3 批：76 级，比较强号是否更快
master = "飞天把你射成蜂窝"
slot = 2
gold = 50000

[team.tian]                   # 2026-10-28 第 3 批：75 级
master = "舔尊"
slot = 3
gold = 50000

[stuck]                       # 已知排除、仍占着师傅名额的徒弟（logs/line_state.json 里有了就以它为准）
d = ["亿万13"]                # 伏地魔4 名下：2026-10-28 181 第 4 步日记因背包满丢失，树 NPC 953 不再给对话框
