# 工序 10：删除已交完料理的小号（数据库里阶段为 delete 的角色），删完关窗口。
# 每个小号：删前核对（任务 78 已完成、背包没料理、收货人收到过料理）→ 还开着的游戏窗口先关掉
# → 重新登录到选角界面 → 按角色 ID 找到它 → 发删除请求 → 等服务器回复 → 关窗口。
# 下一个谁上线不归这个工具管（用户 2026-10-12 定：交给调度）。
# 删除不可撤销：服务器没回复（结果不明）时不会重发，日志会提示人工看选角界面。
# 结果：日志 logs\delete_*.log，汇总 logs\delete_summary_*.json，数据库阶段变成 deleted。
# 路径请用单引号（TOML 单引号字符串里的反斜杠不转义）。

[game]
# exe（游戏路径）每台电脑不同，写在 local.toml
server_index = 0

[batch]
max_windows = 4              # 同时最多开几个登录窗口（不同账号并行；同一账号的多个角色依次删）
launch_interval = 2.0        # 相邻两次拉起游戏的间隔秒数
inject_delay_ms = 3000
login_retries = 2            # 登录失败时（只关本工具刚启动的那个进程）重开的次数
min_free_memory_mb = 3000    # 空闲内存低于这个值就暂停开新窗口

[accounts]
# 号段和密码写在 local.toml（本机号段，所有小号工具共用）。
# 只想让本工具用别的号段时，才在这里写 prefix/start/count/digits（密码仍取 local.toml）。

[delete]
factory = 'testrun/factory.toml'     # 共用的数据库位置等
max_roles = 0                # 本次最多删几个（0 = 全部）。2026-10-12 实测 mw01r1 删除成功后改成 0
reply_timeout = 15           # 发出删除请求后等服务器回复的秒数
close_timeout = 3            # 关小号游戏窗口：先请它正常关闭，这么多秒没关掉就强制结束（实测游戏内窗口不响应正常关闭）
close_settle = 3            # 关掉小号游戏窗口后等几秒再重新登录（让服务器先把旧连接下线）
