# 本机配置模板。每台电脑：复制本文件为 local.toml（同一目录），按本机情况填好。
# local.toml 含密码，已被 .gitignore 排除，不会上传 GitHub。
# 其它 *.toml（工序参数）是共用的、会上传；本文件里的同名设置会覆盖它们。
# 路径请用单引号（TOML 单引号字符串里的反斜杠不转义）。

[game]
exe = 'D:\什么什么大冒险2.0免安装绿色版2.97\v2.1\win32\WaatClient.exe'
server_index = 0
# 服务端单 IP 最多 50 个游戏窗口，超了"进入世界"会卡 40 秒报 error=110。所有工具开窗口前都数本机的
# WAATClient.exe，到 49 个就等；总大脑的小号上限自动 = 50 − 配置的工位数 − 1（删号/重建）− ip_reserve。
# 两台电脑在同一个路由器后面（同一个公网 IP）时共用这 50 个，每台要按自己分到的数填。0 = 不限。
ip_max_clients = 50
ip_reserve = 2               # 留给你手动开的窗口和余量

# 本机使用的小号号段（建角、总大脑、删除、流水线、接力、进游戏共用）。
# 规则：两台电脑的号段绝对不能重叠（同一账号在两边登录会互相挤下线）。
# 3 古井 + 6 海岸（约 100 料理/小时）需要约 130 个账号；算法见 docs/DEPLOY.md 第 4 节。
[accounts]
prefix = "mw"
start = 301
count = 130                  # mw301 .. mw430
digits = 2
password = ""                # 小号密码（所有小号同一个）

# 料理仓库号（一键建仓库号.cmd 用）：全新账号，每个建 4 个角色 <账号>仓1..仓4，专门存收货人的料理。
# 不能和上面的小号号段重叠；这些账号共用一个密码。
[store_accounts]
prefix = "box"
start = 7
count = 10                   # box07 .. box16
digits = 2
password = ""                # 仓库账号密码

# 总大脑这次用哪些仓库账号接收货人的料理（阶段 2c）：只用 stores 表里 ready 的角色，按名单顺序、槽号顺序装满一个换下一个。
# 空表 = 不用。名单里某个账号一个就绪角色都没有，总大脑不启动。第一次实测可以加 unload_max_stacks = 1（只交 1 格）。
[receiver]
stores = []                  # 例如 ["box07", "box08"]

# 工位大号的密码：账号 = "密码"（账号名要和下面 [[station]] 里的 account 一致）
[passwords]
xq05 = ""                    # 调度员
ha01 = ""                    # 古井队长 1..3
xq03 = ""
cap02 = ""
cap07 = ""                   # 海岸队长 1..6
cap08 = ""
cap09 = ""
cap10 = ""
cap11 = ""
cap12 = ""
xq02 = ""                    # 收货人（兼财政主管）

# 本机工位：每个工位一段。只要写了一个 [[station]]，就完全不看 stations.toml 的工位列表。
# 每个工位大号要求（PP鸡权限、宠物烈焰爆发 1504、开局金币、放在哪）见 docs/DEPLOY.md 第 3 节。
# id 一旦定了就别改；换人时只改 account / slot / name，然后：停总大脑 → 一键登录工位.cmd → 一键总大脑.cmd。
# 做到一半换人也行：登录工位时发现同一 id 换了角色，会立刻放开旧角色占着的小号，它们自己退队、带着进度重新排队。
# slot = 这个账号的第几个角色（1..4）；name = 角色名（填了会核对没登错号）。
[[station]]
id = 'dispatcher1'
role = 'dispatcher'          # 调度员：给小号金币、坐 PP鸡 送小号去海岸
account = 'xq05'
slot = 1
name = '小强杀手五号'

[[station]]
id = 'well1'
role = 'well'                # 古井队长：带小号练到 11 级
account = 'ha01'
slot = 1
name = '海岸女队长一号'

[[station]]
id = 'well2'
role = 'well'
account = 'xq03'
slot = 1
name = '小强杀手三号'

[[station]]
id = 'well3'
role = 'well'
account = 'cap02'
slot = 1
name = 'cap02'

[[station]]
id = 'coast1'
role = 'coast'               # 海岸队长：带小号刷腿和鸡屁股
account = 'cap07'
slot = 1
name = 'cap07'

[[station]]
id = 'coast2'
role = 'coast'
account = 'cap08'
slot = 1
name = 'cap08'

[[station]]
id = 'coast3'
role = 'coast'
account = 'cap09'
slot = 1
name = 'cap09'

[[station]]
id = 'coast4'
role = 'coast'
account = 'cap10'
slot = 1
name = '真男人r1'

[[station]]
id = 'coast5'
role = 'coast'
account = 'cap11'
slot = 1
name = '真男人r2'

[[station]]
id = 'coast6'
role = 'coast'
account = 'cap12'
slot = 1
