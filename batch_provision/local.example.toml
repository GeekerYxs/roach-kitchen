# 本机配置模板。每台电脑：复制本文件为 local.toml（同一目录），按本机情况填好。
# local.toml 含密码，已被 .gitignore 排除，不会上传 GitHub。
# 其它 *.toml（工序参数）是共用的、会上传；本文件里的同名设置会覆盖它们。
# 路径请用单引号（TOML 单引号字符串里的反斜杠不转义）。

[game]
exe = 'D:\什么什么大冒险2.0免安装绿色版2.97\v2.1\win32\WaatClient.exe'
server_index = 0

# 本机使用的小号号段（建角、总大脑、删除、流水线、接力、进游戏共用）。
# 规则：两台电脑的号段绝对不能重叠（同一账号在两边登录会互相挤下线）。
# 一条线（1 古井 + 2 海岸，约 42 料理/小时）需要约 60 个账号 = 240 个角色槽。
[accounts]
prefix = "mw"
start = 301
count = 60                   # mw301 .. mw360
digits = 2
password = ""                # 小号密码

# 工位大号的密码：账号 = "密码"（账号名要和 stations.toml 里的 account 一致）
[passwords]
xq01 = ""
qooqp6 = ""
qooqp7 = ""
qooqp8 = ""
hz01 = ""
# bb01 = ""                 # 第三个海岸队长（启用 coast3 时）

# 本机工位（可选）：这台电脑用的工位和 stations.toml 不一样时（比如换了收货人，或两台电脑各跑一条线），
# 把 stations.toml 里全部 [[station]] 段复制到这里再改。这里只要写了一个 [[station]]，就完全不看 stations.toml 的工位列表。
# 换人时 id 保持不变（例如收货人一直叫 receiver1），密码写在上面的 [passwords]。
# 做到一半换人也行：登录工位时发现同一 id 换了角色，会立刻放开旧角色占着的小号，它们自己退队、带着进度重新排队。
# 换下来的旧号窗口程序不再管，请手动关掉。
# 改完：停总大脑 → 双击 一键登录工位.cmd → 双击 一键总大脑.cmd。
# [[station]]
# id = 'receiver1'
# role = 'receiver'
# account = 'hz01'
# slot = 1
# name = '自由一号'

# 本机机器差异（可选）：比如内存小的电脑把小号窗口上限调低
# [supervisor]
# max_windows = 20
