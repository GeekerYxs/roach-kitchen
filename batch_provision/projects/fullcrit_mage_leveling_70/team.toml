# 本项目唯一的队伍配置（只写角色名和战斗参数，不写账号口令）。
# 所有脚本先 import _bootstrap，由它把这里的值写入 SHITU_* 环境变量；
# 命令行里已经设置的 SHITU_* 环境变量优先。换队伍时只改这个文件，
# 或设置 SHITU_TEAM_CONFIG=另一个 toml 路径。

leader = "曾经不曾"                 # 满爆方士队长，唯一输出者
apprentices = ["元素使01", "元素使02", "元素使03", "元素使04"]

player_skill = 354                  # 天之箭
player_skill_level = 7              # 内存读不到该技能等级，按用户确认值
talent_stat = "敏捷"                # 小号升级天赋加点

# 战斗中复活倒地小号的道具（美味小强料理 27002）。0 = 关闭。
# 队长背包里有该道具时启用复活，普通地图一段内允许倒地 max_falls_with_revive 次；
# 没有道具时按 max_falls 处理（默认首次倒地即全队回城重跑）。
revive_item = 27002
max_falls = 1
max_falls_with_revive = 3

# 小号卖白装时是否连身上穿着的白装一起脱下卖掉。
# 默认 false：只卖背包里的白装，避免低等级小号被扒光后更容易倒地。
sell_worn_white = false

# 监狱接人时飞鞋冷却剩余超过这么多秒，就改走铁男付费入城（40,000），不干等。
shoe_wait_max_seconds = 600
