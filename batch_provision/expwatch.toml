# 经验监测（一键经验监测.cmd）：只读游戏内存，不注入、不发包，不影响挂机。
# 角色按窗口标题里的名字找（标题里 "-cap07_" 这样的部分）。窗口关了/重开会自己重新找。

roles = ["真男人r1", "真男人r2", "真男人r3"]

window = 15                 # 近 N 场求均值
poll_seconds = 0.5          # 多久读一次内存
summary_minutes = 10        # 每隔多少分钟打印一次汇总（各级速度、各段预计用时）

# 想知道"从 A 级 0 经验升到 B 级 0 经验要多久"的段
ranges = [[34, 35], [35, 40]]

# 每场记录追加到这个文件（重启后历史还在，各级速度用全部历史算）
battles_csv = "logs/expwatch/battles.csv"
