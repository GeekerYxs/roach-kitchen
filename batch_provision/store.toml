# 本文件两个工具共用：一键建仓库号.cmd（阶段 2a，[store]）和 一键仓库号就位.cmd（阶段 2b，[ship]）。
# 一键建仓库号：用全新账号（local.toml 的 [store_accounts]，例如 box07..box16）建“料理仓库号”。
# 每个账号建 4 个角色 <账号>仓1..仓4 → 新手出村 → 在逍遥村西区吃小肉林、小酒池，到宠物商人小美卖掉新手装备和萝卜糕/胡萝卜汁
# → 背包至少空 free_min 格 → 记进 factory.db 的 stores 表（状态 village_ready = 村里已腾格）。
# 可以随时关掉、重复双击：已就绪的角色跳过，没做完的从现状接着做。
# 结果：logs/store_*.log、logs/store_summary_*.json

[game]
# exe（游戏路径）每台电脑不同，写在 local.toml
server_index = 0

[accounts]
from = "store_accounts"      # 账号和密码取 local.toml 的 [store_accounts]，不是小号号段

[batch]
# 建角（同 一键建角）
parallel = 4                 # 建角时同时最多开几个窗口
keep_windows_open = false    # 建完关窗，后面还要逐个角色登录
kill_on_failure = true       # 建角失败也关窗，免得同一账号再登录时互相挤下线
roles_per_account = 4
role_suffix = "仓"           # 角色名 = 账号 + 后缀 + 序号，例如 box07仓1。游戏不收中文名时改成 "ck"（box07ck1）。
                             # 绝不能用 "r"：以 r+数字 结尾的名字会被总大脑当成小号
create_interval = 1.5
create_timeout = 15
relogin_after_create = true
# 出村 + 腾背包（同 一键流水线）
max_windows = 4              # 同时最多开几个窗口（每个角色一个，做完就关）
launch_interval = 2.0
inject_delay_ms = 3000
login_retries = 2
enter_timeout = 60
min_free_memory_mb = 3000

[novice]
escape_action = 8
timeout = 300
tick = 0.15

[store]
free_min = 35                # 做完背包至少要空这么多格（40 格背包：卖 7 格、吃 2 个后应空 35 格）
timeout = 180                # 每个角色吃+走+卖最多用多少秒

# 一键仓库号就位（阶段 2b，factory/storeship.py）：数据库里 village_ready 的仓库号逐个登录 →
# 不到 min_level 级（PP鸡 要 10 级）就先吃一个地瓜（双倍经验，每个角色只吃一次），由古井队长（local.toml 里第一个 role = well
# 的工位）在出生点组队、去古井带练、回城卷回村（落在小美旁边）→ 在小美按小号规则卖掉打怪掉的杂物，核验空格 >= [store] free_min →
# 调度员（stations.toml / local.toml 里 role = dispatcher 的工位；两个队长都是用到时才自动登录）在出生点给金币 →
# 组队坐 PP鸡 到平静海岸2区 → 调度员回城（队伍解散）→ 仓库号走到 factory.toml 的 receiver_post（海子旁）站稳下线 →
# stores 表改成 ready（就绪），记下坐标和金币。同一账号的角色不能同时在线，所以一趟最多带 4 个不同账号的角色。
# 运行前先停总大脑（它也在用调度员）。可以随时关掉、重复双击：已就绪的跳过，已在海岸的直接走去收货点。
[ship]
gold = 1000                  # 调度员给每个仓库号多少金币（读到的金币 >= 这个数才算到账；之后 PP鸡 扣 190）
min_level = 11               # 低于这个等级先去古井带练（PP鸡 不让 10 级以下传送，2026-10-21 实测；和小号一样练到 11）；已到就跳过
gold_tries = 5               # 每趟给一个仓库号金币最多交易几次（没到账会记下双方现场、关掉仓库号的对话框再试）
ferry_tries = 2              # 一个仓库号最多上几趟调度员的船（这趟没送成就等下一趟）
slots = [1, 2, 3, 4]         # 这次处理每个仓库账号的哪些槽（例如先只做槽 1：在 local.toml 写 [ship] slots = [1]）
timeout = 600                # 每个角色：等调度员摆渡 + 走到收货点，最多用多少秒
train_timeout = 2400         # 每个角色：等古井队长 + 带练，最多用多少秒
gather = 20                  # 调度员每趟出发前，最多等这么多秒让还在登录的仓库号一起上船
post_range = 40              # 离收货点这么近算到了
settle = 2.0                 # 在收货点站稳这么多秒再下线（服务器记下的位置跟上）
